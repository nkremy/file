spring.application.name=file


spring.datasource.url = jdbc:mysql://${DATABASE_HOST:springboot}:${DATABASE_PORT:3306}/${DATABASE_NAME:springboot}
spring.datasource.username = ${DATABASE_USER:springboot}
spring.datasource.password = ${DATABASE_PASSWORD:springboot}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.servlet.multipart.max-file-size = 2GB
spring.servlet.multipart.max-request-size = 2GB

file.upload-dir=storage
